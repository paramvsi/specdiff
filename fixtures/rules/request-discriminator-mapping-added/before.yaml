openapi: 3.1.0
info:
  title: Fixture
  version: 1.0.0
paths:
  /a:
    post:
      operationId: postA
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/Card"
                - $ref: "#/components/schemas/Bank"
              discriminator:
                propertyName: kind
                mapping:
                  card: "#/components/schemas/Card"
                  bank: "#/components/schemas/Bank"
      responses:
        "200":
          description: OK
components:
  schemas:
    Card:
      type: object
      properties:
        kind:
          type: string
        number:
          type: string
    Bank:
      type: object
      properties:
        kind:
          type: string
        iban:
          type: string
