openapi: 3.1.0
info:
  title: Payments
  version: 1.6.0
paths:
  /v1/payments:
    post:
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer }
                currency: { type: string }
      responses:
        "201":
          description: Created
