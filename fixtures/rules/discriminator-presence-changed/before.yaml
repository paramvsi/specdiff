openapi: 3.1.0
info:
  title: Fixture
  version: 1.0.0
paths:
  /a:
    get:
      operationId: getA
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Card"
                  - $ref: "#/components/schemas/Bank"
components:
  schemas:
    Card:
      type: object
      properties:
        kind:
          type: string
        number:
          type: string
    Bank:
      type: object
      properties:
        kind:
          type: string
        iban:
          type: string
