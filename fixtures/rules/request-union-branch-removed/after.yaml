openapi: 3.1.0
info:
  title: Fixture
  version: 1.0.0
paths:
  /a:
    post:
      operationId: postA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/Cat"
      responses:
        "200":
          description: OK
components:
  schemas:
    Cat:
      type: object
      properties:
        meow:
          type: boolean
    Dog:
      type: object
      properties:
        bark:
          type: boolean
    Bird:
      type: object
      properties:
        tweet:
          type: boolean
