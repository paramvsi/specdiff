openapi: 3.1.0
info:
  title: Payments API
  version: 1.5.0
  description: Accept payments, issue refunds and manage saved cards.
servers:
  - url: https://api.example.com
security:
  - bearerAuth: []
tags:
  - name: payments
  - name: refunds
  - name: customers
paths:
  /v1/payments:
    post:
      operationId: createPayment
      summary: Create a payment
      tags: [payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: integer
                  minimum: 1
                  description: Amount in the smallest currency unit.
                currency:
                  type: string
                  description: Three-letter currency code.
                description:
                  type: string
                customer:
                  type: string
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSummary'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listPayments
      summary: List payments
      tags: [payments]
      parameters:
        - name: limit
          in: query
          description: How many payments to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: starting_after
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PaymentStatus'
      responses:
        '200':
          description: A page of payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentList'
  /v1/payments/{id}:
    get:
      operationId: getPayment
      summary: Retrieve a payment
      tags: [payments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/payments/{id}/capture:
    post:
      operationId: capturePayment
      summary: Capture a payment
      tags: [payments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The captured payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSummary'
  /v1/refunds:
    post:
      operationId: createRefund
      summary: Refund a payment
      tags: [refunds]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment]
              properties:
                payment:
                  type: string
                amount:
                  type: integer
      responses:
        '201':
          description: Refund created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
  /v1/refunds/{id}:
    get:
      operationId: getRefund
      summary: Retrieve a refund
      tags: [refunds]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The refund
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
    delete:
      operationId: cancelRefund
      summary: Cancel a refund
      tags: [refunds]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Refund cancelled
  /v1/customers/{id}/cards:
    get:
      operationId: listCustomerCards
      summary: List a customer's saved cards
      tags: [customers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 10
      responses:
        '200':
          description: The customer's cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Card'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Payment:
      type: object
      required: [id, amount, currency, status]
      properties:
        id:
          type: string
        amount:
          type: integer
        currency:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        card:
          $ref: '#/components/schemas/Card'
        created:
          type: integer
      example:
        id: pay_123
        amount: 1999
        currency: EUR
        status: succeeded
    PaymentSummary:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
    PaymentList:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        has_more:
          type: boolean
    PaymentStatus:
      type: string
      enum: [pending, succeeded, failed]
    Card:
      type: object
      required: [brand, last4, exp_month]
      properties:
        brand:
          type: string
          description: Card brand.
        last4:
          type: string
          pattern: '^[0-9]{4}$'
        exp_month:
          type: integer
        exp_year:
          type: integer
    Refund:
      type: object
      required: [id, payment, amount]
      properties:
        id:
          type: string
        payment:
          type: string
        amount:
          type: number
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
