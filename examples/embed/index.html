<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payments API · Specdiff embed example</title>
    <!--
      Build first:  pnpm --filter @specdiff/embed build
      Then serve the repository root over HTTP (fetch does not work from file://), e.g.
        pnpm exec vite --port 8080   (from the repo root)   →   http://localhost:8080/examples/embed/
      specdiff-compare.js and fonts/ are loaded from the same folder as specdiff-embed.js.
    -->
    <link rel="stylesheet" href="../../packages/embed/dist/specdiff-embed.css" />
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="api-reference"></div>
    <script src="../../packages/embed/dist/specdiff-embed.js"></script>
    <script>
      Specdiff.mount(document.getElementById('api-reference'), {
        url: '../../fixtures/samples/payments-v2.yaml',
        compareWith: '../../fixtures/samples/payments-v1.yaml',
        theme: 'system',
        // brand: { name: 'Acme', color: '#1f55c4' },
      });
    </script>
  </body>
</html>
